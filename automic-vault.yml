name:
  isotope:gh

replaces:
  brew:gh

build: |
  make
  codesign --force --options runtime --timestamp \
    --sign "$CODESIGN_IDENTITY" \
    bin/gh
  tar czf out.tgz bin

justification:
  title:
    Unprotected Credential Access
  detail: |
    Upstream GitHub CLI stores credentials in the macOS Keychain where
    same-user processes can retrieve them with `/usr/bin/security`, and
    exposes `gh auth token` as Secret Disclosure.

    This Isotope routes token reads through Automic Vault's authenticated XPC
    service, which applies policy or requests Approval for each Secret Use and
    records its Authorization Decision in Authorization History.
